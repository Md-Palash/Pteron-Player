name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This repo does not commit a gradle-wrapper.jar, so we install Gradle
      # directly and use it to generate a correct wrapper before building.
      # (Safer than hand-writing/committing a wrapper jar without a way to
      # verify it here.)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK (for quick install/testing)
        run: ./gradlew assembleDebug --stacktrace

      # The debug APK is NOT representative of real app size (no minification,
      # no resource shrinking). "benchmark" mirrors the release build type
      # (minified + shrunk) but is signed with the debug key, so it's
      # installable without a production keystore -- use this number, not
      # the debug APK's, when checking against the 15MB target.
      - name: Build benchmark APK (minified, for real size measurement)
        run: ./gradlew assembleBenchmark --stacktrace

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/benchmark/*.apk; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pteron-player-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload benchmark APK (realistic size)
        uses: actions/upload-artifact@v4
        with:
          name: pteron-player-benchmark
          path: app/build/outputs/apk/benchmark/*.apk
